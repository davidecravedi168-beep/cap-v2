name: Validate The Office UI

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "app.js"
      - "universal-office.js"
      - "universal-office.css"
      - "weekly-league.js"
      - "weekly-league.css"
      - "interactive-office.js"
      - "interactive-office.css"
      - "director-name.js"
      - "office-models.js"
      - "model-board-ui.js"
      - "office-runtime.js"
      - "office-runtime.css"
      - "server/office-gateway.mjs"
      - "server/README.md"
      - "server/.env.example"
      - "MODEL_BOARD.md"
      - "WORK_RECOVERED.md"
      - "styles.css"
      - "oddities.css"
      - ".github/workflows/office-ui.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "index.html"
      - "app.js"
      - "universal-office.js"
      - "universal-office.css"
      - "weekly-league.js"
      - "weekly-league.css"
      - "interactive-office.js"
      - "interactive-office.css"
      - "director-name.js"
      - "office-models.js"
      - "model-board-ui.js"
      - "office-runtime.js"
      - "office-runtime.css"
      - "server/office-gateway.mjs"
      - "server/README.md"
      - "server/.env.example"
      - "MODEL_BOARD.md"
      - "WORK_RECOVERED.md"
      - "styles.css"
      - "oddities.css"
      - ".github/workflows/office-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check universal-office.js
          node --check weekly-league.js
          node --check director-name.js
          node --check interactive-office.js
          node --check office-models.js
          node --check model-board-ui.js
          node --check office-runtime.js
          node --check server/office-gateway.mjs
      - name: Universal Office contract
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('app.js').read_text(encoding='utf-8')
          ux=Path('universal-office.js').read_text(encoding='utf-8')
          css=Path('universal-office.css').read_text(encoding='utf-8')
          league=Path('weekly-league.js').read_text(encoding='utf-8')
          league_css=Path('weekly-league.css').read_text(encoding='utf-8')
          hq=Path('interactive-office.js').read_text(encoding='utf-8')
          hq_css=Path('interactive-office.css').read_text(encoding='utf-8')
          models=Path('office-models.js').read_text(encoding='utf-8')
          runtime=Path('office-runtime.js').read_text(encoding='utf-8')
          gateway=Path('server/office-gateway.mjs').read_text(encoding='utf-8')
          recovered=Path('WORK_RECOVERED.md').read_text(encoding='utf-8')
          required_app=['universal-office.js?v=2.0','weekly-league.js?v=1.0','interactive-office.js?v=3.0']
          required_ux=['Cosa dobbiamo fare?','Aree di lavoro','Progetti','Lavori affidati all’ufficio','SOFTWARE ≠ CENTRO','approval','routePlan','classify']
          required_css=['.universal-command','.area-grid','.project-grid','.routing-card']
          required_league=['Dipendente della settimana','recordOutcome','quality:.45','quantity:.10','MIN_FOR_CROWN=3','Anti-gaming','nessuna classifica']
          required_hq=['Direttore','CHE AI È?','assignTo','dispatch','TheOfficeHQ']
          required_models=['gpt-6-astra','claude-fable-5','claude-opus-5','muse-spark-1.3','gpt-5.6-sol','glm-5.3','grok-4.6','TOP 7']
          required_runtime=['Authorization','sessionStorage','/v1/jobs','AI operative','TheOfficeRuntime']
          required_gateway=['api.openai.com/v1/responses','api.anthropic.com/v1/messages','api.x.ai/v1/responses','META_API_BASE','ZAI_API_BASE','OFFICE_SESSION_TOKEN','web_search']
          required_recovered=['Quality Director','Approval Gate','Executor','Model Board']
          missing=[x for x in required_app if x not in app]+[x for x in required_ux if x not in ux]+[x for x in required_css if x not in css]+[x for x in required_league if x not in league]+[x for x in required_hq if x not in hq]+[x for x in required_models if x not in models]+[x for x in required_runtime if x not in runtime]+[x for x in required_gateway if x not in gateway]+[x for x in required_recovered if x not in recovered]
          if missing:
              raise SystemExit('The Office contract missing: '+', '.join(missing))
          banned=['gpt-5.6-terra','gemini-3.8-flash','agent-api:high','sonar-deep-research']
          leaked=[x for x in banned if x in models]
          if leaked:
              raise SystemExit('Non-top-player model leaked into active model board: '+', '.join(leaked))
          print('The Office TOP 7 model pool + runtime contract: OK')
          PY
      - name: Whitespace check
        run: git diff --check
