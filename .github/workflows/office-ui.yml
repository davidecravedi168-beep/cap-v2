name: Validate The Office UI

on:
  push:
    branches: ["main"]
    paths:
      - "*.js"
      - "*.css"
      - "*.md"
      - "server/**"
      - ".github/workflows/office-ui.yml"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check universal-office.js
          node --check weekly-league.js
          node --check director-name.js
          node --check interactive-office.js
          node --check office-extra-roles.js
          node --check office-models.js
          node --check office-free-model-board.js
          node --check model-board-ui.js
          node --check office-runtime-free.js
          node --check office-room.js
      - name: Office contract
        run: |
          python - <<'PY'
          from pathlib import Path
          director=Path('director-name.js').read_text(encoding='utf-8')
          room=Path('office-room.js').read_text(encoding='utf-8')
          room_css=Path('office-room.css').read_text(encoding='utf-8')
          runtime=Path('office-runtime-free.js').read_text(encoding='utf-8')
          board=Path('office-free-model-board.js').read_text(encoding='utf-8')
          league=Path('weekly-league.js').read_text(encoding='utf-8')
          required=[
            (director,['office-runtime-free.js?v=1.0','office-room.js?v=1.0']),
            (room,['Il tuo ufficio AI','INCARICO ATTUALE','Dallo al Direttore','Lavorazione in corso','TheOfficeRoom']),
            (room_css,['.office-room-v4','.or-desk.busy','.or-roundtable','.or-command']),
            (runtime,['zeroCost:true','TheOfficeRuntime']),
            (board,['FREE 7','NO KEY','zeroCost=true','noKey=true']),
            (league,['Dipendente della settimana','quality:.45','quantity:.10'])
          ]
          missing=[]
          for text,need in required:
            missing += [x for x in need if x not in text]
          if missing:
            raise SystemExit('Office contract missing: '+', '.join(missing))
          print('Real-office UI + zero-cost runtime contract: OK')
          PY
      - name: Whitespace check
        run: git diff --check
