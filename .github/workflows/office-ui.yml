name: Validate The Office
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: V9.3 preview Model Board smoke
        if: github.event_name == 'pull_request' && github.head_ref == 'office-v93-real-model-board'
        env:
          OFFICE_PREVIEW: https://br-ancient-rain-aydxyv4k-officefree.compute.c-5.us-east-2.aws.neon.tech
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error --max-time 20 "$OFFICE_PREVIEW/health")"
          echo "$health" | jq -e '.ok == true and .zeroCost == true and .roleRouting == true and .modelBoard.Coda.preferred.model == "cohere/north-mini-code" and .modelBoard.Verity.preferred.provider == "Vireonix"' >/dev/null

          check_role() {
            agent="$1"
            expected_field="$2"
            expected_value="$3"
            prompt="$4"
            body_file="$(mktemp)"
            http_code="$(curl --silent --show-error --max-time 40 -o "$body_file" -w '%{http_code}' \
              -H 'Origin: https://davidecravedi168-beep.github.io' \
              -H 'Content-Type: application/json' \
              --data "{\"id\":\"ci-live-${agent,,}\",\"text\":\"$prompt\",\"team\":[\"$agent\"],\"zeroCost\":true,\"intent\":\"draft-only\"}" \
              "$OFFICE_PREVIEW/v1/jobs")"
            if [ "$http_code" = "200" ]; then
              jq -e --arg agent "$agent" --arg field "$expected_field" --arg expected "$expected_value" \
                '.status == "completed" and .zeroCost == true and .routedAgent == $agent and (.provider|length>0) and (.model|length>0) and ((if $field == "model" then .preferred.model else .preferred.provider end) == $expected)' \
                "$body_file" >/dev/null
            elif [ "$http_code" = "503" ]; then
              jq -e '.status == "failed" and .zeroCost == true and .retryable == true and (.error | contains("Nessun costo"))' "$body_file" >/dev/null
              echo "Free provider capacity unavailable for $agent; routing contract remains verified by /health + unit tests."
            else
              cat "$body_file"
              echo "Unexpected HTTP $http_code for $agent" >&2
              exit 1
            fi
            rm -f "$body_file"
          }

          check_role Coda model cohere/north-mini-code 'Scrivi una funzione JavaScript add(a,b) in una riga.'
          check_role Verity provider Vireonix 'Controlla criticamente questa frase: 2+2=5. Rispondi in una riga.'
